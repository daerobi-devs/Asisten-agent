version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: lxion-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lxion}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lxion_secret_2026}
      POSTGRES_DB: ${POSTGRES_DB:-lxion_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lxion} -d ${POSTGRES_DB:-lxion_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: lxion-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data

  lxion-core:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: lxion-core
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    env_file:
      - .env
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./workspace:/app/workspace
      - ./credentials:/app/credentials
      - ./whatsapp_sessions:/app/whatsapp_sessions
      - ./logs:/app/logs
      - ./.agents:/app/.agents

volumes:
  postgres_data:
  redis_data: