version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lxion}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lxion_secret_2026}
      POSTGRES_DB: ${POSTGRES_DB:-lxion_db}
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lxion} -d ${POSTGRES_DB:-lxion_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    expose:
      - "6379"
    volumes:
      - redis_data:/data

  lxion-core:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      - POSTGRES_HOST=postgres
      - DATABASE_URL=postgresql+asyncpg://${POSTGRES_USER:-lxion}:${POSTGRES_PASSWORD:-lxion_secret_2026}@postgres:5432/${POSTGRES_DB:-lxion_db}
      - REDIS_HOST=redis
      - REDIS_URL=redis://redis:6379/0
    expose:
      - "8000"
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./workspace:/app/workspace
      - ./credentials:/app/credentials
      - ./whatsapp_sessions:/app/whatsapp_sessions
      - ./logs:/app/logs
      - ./.agents:/app/.agents

volumes:
  postgres_data:
  redis_data: