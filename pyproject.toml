[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "lxion"
version = "0.3.0"
description = "LXION - Autonomous Full-Featured AI Agent"
readme = "PRD_v3.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "uvicorn",
    "pydantic",
    "pydantic-settings",
    "sqlalchemy",
    "asyncpg",
    "httpx",
    "rich",
    "python-dotenv",
    "apscheduler",
    "python-telegram-bot",
    "discord.py",
    "qrcode",
    "Pillow",
    "psutil",
]

[project.scripts]
lxion = "lxion.cli.terminal:main"